name: Offline quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install .
      - run: python -m pytest -q
      - run: python -m ruff check netshield scripts tests/test_*.py dashboard/app.py setup.py
      - run: python -m ruff format --check netshield scripts tests/test_*.py dashboard/app.py setup.py
      - run: python scripts/publication_check.py
      - run: node --check dashboard/static/js/v2-console.mjs
      - name: Installer shell syntax and lint (no installation)
        if: runner.os == 'Linux'
        run: |
          bash -n install.sh
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends shellcheck
          fi
          shellcheck install.sh
      - run: python -m netshield --data runner-data init
      - run: python -m netshield --data runner-data replay port-scan
# Privileged lab is deliberately absent. Run its explicit gate on an owned VM.
# This workflow does not publish packages, deploy, or modify GitHub releases.
